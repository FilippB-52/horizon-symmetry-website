<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- A client's private space. Never indexed, never linked from the site.
     Which client is decided by who is logged in (js/portal-gate.js). -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Client space · Horizon Symmetry</title>
<meta name="theme-color" content="#000000">

<link rel="icon" href="../assets/favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="../assets/favicon-180.png">

<link rel="preload" href="../assets/fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/PPMondwest-Regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="../css/styles.css?v=202609261300">
<link rel="stylesheet" href="../css/case.css?v=202609261300">
<link rel="stylesheet" href="../css/portal.css?v=202609281500">
</head>

<body class="case portal is-gated">
<a class="skip-link" href="#view">Skip to content</a>

<div class="app">
  <!-- The navigation. Drawn by js/portal.js from the client's record. -->
  <aside class="side" id="side"></aside>

  <div class="p-glow" aria-hidden="true"></div>

  <div class="main">
    <!-- On a phone this is the bar: menu, whose space this is, and the way
         to reach us. On a desktop only the button shows. -->
    <header class="main__head">
      <button class="main__menu" id="menu-btn" type="button" data-action="menu" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
        Menu <span class="p-dot" id="menu-dot" hidden></span>
      </button>
      <p class="main__name" id="main-name"></p>
      <button class="bar__end" type="button" data-action="book" aria-label="Book a call">
        <span>Book a call</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 14 14 6M7 6h7v7"/>
        </svg>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="case-legal">
      <p>Horizon Symmetry is a trading name of Zencup, S.L. · CIF B22569602 · Calle de Lagasca 63, 4A, 28001 Madrid, Spain</p>
    </footer>
  </div>
</div>

<div class="scrim" data-action="menu-close" aria-hidden="true"></div>

<noscript>
  <p style="padding:8rem 2rem;text-align:center;color:#B9B2C6">
    Your client space needs JavaScript. Write to horizonsymmetrystudio@gmail.com and we'll send everything by email.
  </p>
</noscript>

<!-- The questionnaire, one question at a time. -->
<div class="qf" id="qf" role="dialog" aria-modal="true" aria-labelledby="qf-q" hidden>
  <div class="qf__top">
    <button class="qf__close" type="button" data-action="q-close">Save and close</button>
    <div class="qf__bar" id="qf-bar"><i></i></div>
    <span class="qf__count" id="qf-count"></span>
  </div>
  <div class="qf__stage" id="qf-stage"></div>
  <div class="qf__foot" id="qf-foot" hidden>
    <button class="p-link" id="qf-back" type="button" data-action="q-back">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 10h-13M9 4.5 3.5 10 9 15.5"/></svg>
      Back
    </button>
    <span class="qf__keys" id="qf-keys"></span>
    <button class="cta cta--solid" id="qf-next" type="button" data-action="q-next">
      <span class="cta__label">Next</span>
      <span class="cta__arrow"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h13M11 4.5 16.5 10 11 15.5"/></svg></span>
    </button>
  </div>
</div>

<!-- Previews, full size. -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Preview" hidden>
  <div class="lb__top">
    <span id="lb-count"></span>
    <button class="lb__btn" type="button" data-action="lb-close" aria-label="Close preview">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
  </div>
  <div class="lb__stage"><img class="lb__img" id="lb-img" alt=""></div>
  <div class="lb__foot">
    <button class="lb__btn" type="button" data-action="lb-prev" aria-label="Previous">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 10h-13M9 4.5 3.5 10 9 15.5"/></svg>
    </button>
    <button class="lb__btn" type="button" data-action="lb-next" aria-label="Next">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h13M11 4.5 16.5 10 11 15.5"/></svg>
    </button>
  </div>
</div>

<!-- Booking, in place. Cal.com loads only when this first opens. -->
<div class="calm" id="calm" role="dialog" aria-modal="true" aria-labelledby="calm-title" hidden>
  <div class="calm__box">
    <div class="calm__top">
      <h2 id="calm-title">Book a call</h2>
      <button class="lb__btn" type="button" data-action="cal-close" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
      </button>
    </div>
    <div class="calm__frame" id="cal-inline"></div>
    <p class="calm__foot">Calendar not loading? <a href="https://cal.com/horizon-symmetry/30min" target="_blank" rel="noopener">Open it in a new tab</a>.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Until the space opens: checking who this is, or telling them why
     there is nothing to open yet. -->
<div class="gate" id="gate" aria-live="polite">
  <p class="gate__wait">Opening your space</p>
</div>

<script src="config.js?v=202610031200"></script>
<script src="../js/portal-auth.js?v=202609291505" defer></script>
<script src="../js/portal-gate.js?v=202610031435" defer></script>
</body>
</html>
