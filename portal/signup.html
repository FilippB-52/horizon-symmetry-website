<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- The door to a client's private space. Never indexed, never linked from the site. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Create your account · Client space · Horizon Symmetry</title>
<meta name="theme-color" content="#000000">

<link rel="icon" href="../assets/favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="../assets/favicon-180.png">

<link rel="preload" href="../assets/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/PPMondwest-Regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="../css/styles.css?v=202609261300">
<link rel="stylesheet" href="../css/portal.css?v=202609281500">
<link rel="stylesheet" href="../css/portal-login.css?v=202609281500">
</head>

<body class="portal auth" data-page="signup">
<div class="auth__glow" aria-hidden="true"></div>

<main class="auth__wrap">
  <a class="auth__studio" href="../"><img src="../assets/logo-mark.png" alt="" width="1039" height="867">Horizon Symmetry</a>

  <section class="auth__card" aria-labelledby="auth-title">
    <h1 class="auth__title" id="auth-title" tabindex="-1">Create your account</h1>
    <p class="auth__lede">Use the email we've been writing to. That's how we connect you to your project.</p>
    <div class="auth__google" id="google" hidden>
      <button class="auth__ghost" type="button" data-google>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="#4285F4" d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M10 20c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H1.1v2.6A10 10 0 0 0 10 20z"/><path fill="#FBBC05" d="M4.4 12c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V5.4H1.1a10 10 0 0 0 0 9.2L4.4 12z"/><path fill="#EA4335" d="M10 4c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 1.1 5.4L4.4 8C5.2 5.7 7.4 4 10 4z"/></svg>
        Continue with Google
      </button>
      <p class="auth__or"><span>or</span></p>
    </div>
    <form class="auth__form" novalidate>
      <p class="auth__err" id="form-err" role="alert"></p>
      <div class="fld">
        <label for="name">Your name</label>
        <input class="field" id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-err">
        <p class="fld__err" id="name-err" aria-live="polite"></p>
      </div>
      <div class="fld">
        <label for="email">Email</label>
        <input class="field" id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-err">
        <p class="fld__err" id="email-err" aria-live="polite"></p>
      </div>
      <div class="fld">
        <label for="password">Password</label>
        <div class="pw">
          <input class="field" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-err password-hint">
          <button class="pw__eye" type="button" data-eye aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 10S4.8 4.5 10 4.5 18.2 10 18.2 10 15.2 15.5 10 15.5 1.8 10 1.8 10z"/><circle cx="10" cy="10" r="2.6"/></svg></button>
        </div>
        <p class="fld__hint" id="password-hint">At least 8 characters.</p>
        <p class="fld__err" id="password-err" aria-live="polite"></p>
      </div>
      <button class="cta cta--solid auth__go" type="submit"><span class="cta__label">Create account</span></button>
    </form>
    <p class="auth__alt">Already have an account? <a href="login">Log in</a></p>
  </section>

  <div class="auth__test" id="test-note" hidden></div>
</main>

<noscript>
  <p style="padding:0 2rem 4rem;text-align:center;color:#B9B2C6">
    Logging in needs JavaScript. Write to horizonsymmetrystudio@gmail.com and we'll send everything by email.
  </p>
</noscript>

<script src="config.js?v=202609281500"></script>
<script src="../js/portal-auth.js?v=202609291505" defer></script>
<script src="../js/portal-login.js?v=202609281500" defer></script>
</body>
</html>
