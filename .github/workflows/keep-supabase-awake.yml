name: Keep the client space database awake

# Supabase pauses a free project after a week with no activity, and a
# paused project means no client can log in. This calls it twice a week.
# Until portal/config.js holds a Supabase URL and key it does nothing.

on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: portal/config.js
          sparse-checkout-cone-mode: false
      - name: Call the database
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' portal/config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' portal/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Not connected yet, nothing to keep awake."
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
