name: Keep the client space database awake

# Supabase pauses a free project after a week of too little database
# activity, and a paused project means no client can log in. Supabase's
# own guide says it takes a few requests a day, so this runs four times a
# day and makes three real requests each time. (Twice a week was not
# enough: the project paused on about 13 Oct 2026 and stayed down a month.)
#
# If this fails, the client space is probably DOWN. GitHub emails the
# failure to the repo owner. Restore: supabase.com/dashboard, open
# hs-client-space, Restore project.
#
# GitHub switches scheduled jobs off in a public repo after 60 days with
# no commits. It emails first; pushing any commit keeps it going.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: portal/config.js
          sparse-checkout-cone-mode: false
      - name: Call the database
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' portal/config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' portal/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Not connected yet, nothing to keep awake."
            exit 0
          fi
          # the database, through a function that reads a real table
          for i in 1 2 3; do
            curl -fsS --retry 3 --retry-delay 5 -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
            echo
            sleep 2
          done
          # and the login service, which clients need just as much
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$URL/auth/v1/settings" -H "apikey: $KEY"
          echo "awake"
